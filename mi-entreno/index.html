<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f14">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Entreno">
<meta name="description" content="Registro personal de entrenos en casa con seguimiento del dolor de hombro.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Mi Entreno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<script>
  /* Aplica el tema guardado antes de pintar, para que no parpadee */
  try { const t = (JSON.parse(localStorage.getItem('mientreno.v1')) || {}).settings?.theme; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) { /* sin tema guardado */ }
</script>
<style>
/* =========================================================
   Diseño "Lima Nocturna" (skill diseno-mi-entreno)
   Todos los colores salen de estas variables: el tema claro solo las cambia.
   ========================================================= */
:root{
  /* superficies y texto */
  --bg:#0d0f14;--s1:#161a22;--s2:#1c2029;--s3:#262b36;--line:#232835;--line2:#2e3442;
  --tx:#f2f4f8;--mu:#8d95a7;--top-bg:rgba(13,15,20,.9);--nav-bg:rgba(17,20,26,.94);
  /* acento: --ac es el relleno, --ac-tx el acento usado como texto, --ac-ink el texto sobre el relleno */
  --ac:#c8f53a;--ac-tx:#c8f53a;--ac-ink:#0d0f14;--ac-soft:rgba(200,245,58,.12);--ac-line:rgba(200,245,58,.45);
  /* dolor (siempre los mismos) y cuidado del hombro */
  --ok:#3fd08f;--warn:#f6b93e;--bad:#ff5f5f;--care:#ff9f5a;--on-pain:#0d0f14;
  --ok-soft:rgba(63,208,143,.14);--warn-soft:rgba(246,185,62,.14);--bad-soft:rgba(255,95,95,.14);--care-soft:rgba(255,159,90,.14);
  /* series de gráficos (paleta validada para daltonismo) */
  --c1:#3987e5;--c2:#d95926;--c3:#199e70;
  /* personajes */
  --fig:#eef1f6;--fig-ink:#0d0f14;--prop:#4a5263;--prop2:#6b7487;
  /* tipografía */
  --f-num:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-txt:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  /* espaciado, radios, alturas */
  --sp1:4px;--sp2:8px;--sp3:12px;--sp4:16px;--sp5:24px;--sp6:32px;
  --r-ctl:10px;--r-card:16px;--r-sheet:24px;--tabh:64px;
  --shadow:0 16px 40px rgba(0,0,0,.55);
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
/* Tema claro: si el teléfono está en modo claro (y no elegiste "Oscuro"), o si elegiste "Claro" */
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#f3f4f7;--s1:#ffffff;--s2:#f0f2f6;--s3:#e2e6ed;--line:#e1e4ea;--line2:#d3d8e1;
    --tx:#11141a;--mu:#5a6273;--top-bg:rgba(243,244,247,.9);--nav-bg:rgba(255,255,255,.94);
    --ac:#c8f53a;--ac-tx:#4a6600;--ac-ink:#11141a;--ac-soft:rgba(110,150,0,.12);--ac-line:rgba(90,125,0,.5);
    --ok:#14935a;--warn:#a86a00;--bad:#d93636;--care:#b85400;--on-pain:#ffffff;
    --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;
    --fig:#2a2f3a;--fig-ink:#ffffff;--prop:#b9c0cc;--prop2:#8f98a8;
    --shadow:0 16px 40px rgba(20,25,40,.18);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f3f4f7;--s1:#ffffff;--s2:#f0f2f6;--s3:#e2e6ed;--line:#e1e4ea;--line2:#d3d8e1;
  --tx:#11141a;--mu:#5a6273;--top-bg:rgba(243,244,247,.9);--nav-bg:rgba(255,255,255,.94);
  --ac:#c8f53a;--ac-tx:#4a6600;--ac-ink:#11141a;--ac-soft:rgba(110,150,0,.12);--ac-line:rgba(90,125,0,.5);
  --ok:#14935a;--warn:#a86a00;--bad:#d93636;--care:#b85400;--on-pain:#ffffff;
  --c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;
  --fig:#2a2f3a;--fig-ink:#ffffff;--prop:#b9c0cc;--prop2:#8f98a8;
  --shadow:0 16px 40px rgba(20,25,40,.18);
  color-scheme:light;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 var(--f-txt);-webkit-text-size-adjust:100%}
body{padding-bottom:calc(var(--tabh) + 20px + env(safe-area-inset-bottom));overflow-x:hidden}
body.resting{padding-bottom:calc(var(--tabh) + 120px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{line-height:1.15}
.num,.stat b,.chrono,.rest-time,.stp-v,.slider .num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* ---------- Barra superior ---------- */
.top{position:sticky;top:0;z-index:6;background:var(--top-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.top h1{font:700 28px/1 var(--f-num);letter-spacing:.3px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .btn{font-family:var(--f-num);font-variant-numeric:tabular-nums}
main{padding:16px 16px 8px;max-width:640px;margin:0 auto}

/* ---------- Tarjetas y texto ---------- */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;margin:0 0 12px}
.card h2{font:700 22px/1.1 var(--f-num);letter-spacing:.2px;margin:0 0 8px}
.card h3{font-size:12px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:var(--mu);margin:16px 0 8px}
.card.hl{border-color:var(--ac-line);box-shadow:0 0 0 1px var(--ac-soft)}
.card.g{border-color:var(--ok)}.card.y{border-color:var(--warn)}.card.r{border-color:var(--bad)}
.muted{color:var(--mu)}.small{font-size:14px}.tiny{font-size:12.5px}
.center{text-align:center}
.mt{margin-top:12px}.mt2{margin-top:16px}.mb0{margin-bottom:0}
p{margin:6px 0}
ul.clean{list-style:none;margin:0;padding:0}
ul.dots{margin:6px 0;padding-left:20px}ul.dots li{margin:4px 0}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 16px;border-radius:var(--r-ctl);
  border:1px solid var(--line2);background:var(--s2);color:var(--tx);font-weight:600;cursor:pointer;text-decoration:none;touch-action:manipulation;
  transition:transform .15s var(--ease),filter .15s var(--ease),background .15s var(--ease)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--ac-ink);font:700 19px var(--f-num);letter-spacing:.4px}
.btn.pri:active{filter:brightness(.92)}
.btn.okb{background:transparent;border:2px solid var(--ac-line);color:var(--ac-tx);font:700 18px var(--f-num);letter-spacing:.4px}
.btn.big{min-height:56px;font-size:20px;width:100%;border-radius:14px}
.btn.block{width:100%}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mu)}
.btn.sm{min-height:44px;padding:0 12px;font-size:14.5px}
.btn.top-live{min-height:40px;font-size:18px;padding:0 12px}
.btn.icon{min-width:48px;padding:0 10px}
.btn[disabled]{opacity:.4}
.link{background:none;border:0;color:var(--ac-tx);padding:10px 0;min-height:44px;font-weight:600;cursor:pointer}

/* ---------- Etiquetas ---------- */
.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--s3);color:var(--mu);vertical-align:middle;white-space:nowrap}
.badge.care{background:var(--care-soft);color:var(--care)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.ac{background:var(--ac-soft);color:var(--ac-tx)}
.p-g{color:var(--ok)}.p-y{color:var(--warn)}.p-r{color:var(--bad)}
.bg-g{background:var(--ok)}.bg-y{background:var(--warn)}.bg-r{background:var(--bad)}
.note{border-radius:12px;padding:12px 14px;margin:8px 0;font-size:15px;background:var(--s2);border-left:4px solid var(--line2)}
.note.up{border-color:var(--ok);background:var(--ok-soft)}.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.note.info{border-color:var(--ac)}

/* ---------- Barra inferior con indicador animado ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--nav-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{position:relative;flex:1;height:var(--tabh);background:none;border:0;color:var(--mu);font-size:11.5px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:color .2s var(--ease)}
.tabs button.on{color:var(--ac-tx)}
.tabs svg{width:24px;height:24px}
.tabs .ind{position:absolute;top:0;left:0;width:20%;height:3px;display:flex;justify-content:center;pointer-events:none;
  transform:translateX(calc(var(--i,0) * 100%));transition:transform .25s var(--ease)}
.tabs .ind::after{content:"";width:36px;height:3px;border-radius:0 0 3px 3px;background:var(--ac)}
.tabs .live{position:absolute;top:10px;left:calc(50% + 9px);width:9px;height:9px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 2px var(--s1)}

/* ---------- Estadísticas y barras ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-card);padding:12px 14px}
.stat b{display:block;font-size:38px;line-height:1;font-weight:700;margin-bottom:4px}
.stat > span{font-size:13px;color:var(--mu)}
.bar{height:10px;border-radius:99px;background:var(--s3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .4s var(--ease)}

/* ---------- Slider de dolor ---------- */
.slider{margin:4px 0 2px;--pc:var(--ok)}
.slider .val{display:flex;align-items:flex-end;gap:6px}
.slider .num{font-size:84px;font-weight:700;line-height:.85;color:var(--pc);transition:color .2s var(--ease)}
.slider .of{font:600 24px var(--f-num);color:var(--mu);margin-bottom:4px}
.slider .face{margin-left:auto;font-size:52px;line-height:1;transition:transform .2s var(--ease)}
.slider .face.pop{animation:pop .25s var(--ease)}
.slider .pword{font-weight:600;color:var(--pc);margin-top:8px}
input[type=range]{width:100%;height:48px;background:transparent;-webkit-appearance:none;appearance:none;margin:2px 0 0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:99px;background:linear-gradient(90deg,var(--ok) 0 25%,var(--warn) 25% 45%,var(--bad) 45%)}
input[type=range]::-moz-range-track{height:10px;border-radius:99px;background:linear-gradient(90deg,var(--ok) 0 25%,var(--warn) 25% 45%,var(--bad) 45%)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:36px;height:36px;margin-top:-13px;border-radius:50%;background:#fff;border:7px solid var(--pc,var(--ok));box-shadow:0 2px 8px rgba(0,0,0,.45)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:7px solid var(--pc,var(--ok))}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);padding:0 4px}
.emojis{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.emojis button{min-height:56px;font-size:28px;border-radius:12px;border:1px solid var(--line2);background:var(--s2);cursor:pointer;transition:transform .15s var(--ease)}
.emojis button:active{transform:scale(.94)}
.emojis button.on{border-color:var(--ac);background:var(--ac-soft);box-shadow:inset 0 0 0 1px var(--ac)}

/* ---------- Steppers: número grande arriba, botones − / + abajo ---------- */
.steps{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin:12px 0}
.stp{min-width:0;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:8px 6px 6px;text-align:center}
.stp-l{font-size:11.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--mu)}
.stp > .stp-v{display:flex;align-items:baseline;justify-content:center;min-height:52px;font-size:44px;font-weight:700;line-height:1.1;padding:2px 0 4px}
.stp-v small{font:600 15px var(--f-txt);color:var(--mu);margin-left:3px}
.stp-v.pop{animation:pop .22s var(--ease)}
.stp-bs{display:flex;gap:6px}
.stp-bs .stp-b{flex:1;width:auto;border-radius:8px}
.stp-b{width:48px;min-height:48px;border:0;background:var(--s3);font:600 26px var(--f-num);cursor:pointer;touch-action:manipulation;flex:none;color:var(--tx)}
.stp-b:active{background:var(--line2)}
/* stepper horizontal (Ajustes y editor de plantillas) */
.stp-c{display:flex;align-items:stretch;background:var(--s2);border:1px solid var(--line2);border-radius:var(--r-ctl);overflow:hidden}
.stp-c .stp-v{flex:1;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;padding:0 2px;text-align:center;line-height:1.1}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}

/* ---------- Tarjetas de ejercicio ---------- */
.ex{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-card);margin:0 0 10px;overflow:hidden;transition:border-color .2s var(--ease)}
.ex.open{border-color:var(--ac-line);box-shadow:0 0 0 1px var(--ac-soft),0 12px 30px rgba(0,0,0,.25)}
.ex.done:not(.open){opacity:.72}
.ex-h{display:flex;gap:12px;align-items:center;padding:14px;cursor:pointer;width:100%;background:none;border:0;text-align:left;min-height:64px}
.ex-h .n{width:32px;height:32px;flex:none;border-radius:50%;background:var(--s3);display:flex;align-items:center;justify-content:center;font:700 17px var(--f-num)}
.ex.open .ex-h .n{background:var(--ac);color:var(--ac-ink)}
.ex.done .ex-h .n{background:var(--ac-soft);color:var(--ac-tx)}
.ex-h b{display:block;font-size:16.5px}
.ex.open .ex-h b{font:700 24px/1.05 var(--f-num);letter-spacing:.2px;margin-bottom:2px}
.ex-b{padding:0 14px 14px}
.sets{margin:12px 0 4px}
.sets li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.sets li .del{margin-left:auto}
.pdot{display:inline-block;min-width:28px;text-align:center;font:700 14px var(--f-num);padding:2px 7px;border-radius:99px;color:var(--on-pain)}
.tools{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.chk{display:flex;gap:12px;align-items:center;padding:10px 2px;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;min-height:52px}
.chk:first-child{border-top:0}
.box{width:28px;height:28px;flex:none;border-radius:8px;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--ac-ink);transition:background .15s var(--ease)}
.chk.on .box{background:var(--ac);border-color:var(--ac)}
.chk.on span:last-child{color:var(--mu);text-decoration:line-through}
.sesbar{position:sticky;top:var(--toph,54px);z-index:5;margin:-16px -16px 12px;padding:10px 16px;background:var(--top-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.chrono{font-size:34px;font-weight:700;line-height:1}
.sesprog{height:4px;border-radius:99px;background:var(--s3);overflow:hidden;margin-top:6px}
.sesprog i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .4s var(--ease)}

/* ---------- Plantillas ---------- */
.tpl{display:block;width:100%;text-align:left;background:var(--s1);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;margin:0 0 10px;cursor:pointer;color:var(--tx)}
.tpl:active{transform:scale(.99)}
.tpl.rec{border:2px solid var(--ac);box-shadow:0 0 0 4px var(--ac-soft)}
.tpl.no{opacity:.55}
.tpl b{font:700 22px var(--f-num);letter-spacing:.2px}

/* ---------- Temporizador de descanso: barra flotante con anillo ---------- */
.rest{position:fixed;left:12px;right:12px;bottom:calc(var(--tabh) + 10px + env(safe-area-inset-bottom));z-index:19;max-width:616px;margin:0 auto;
  background:var(--s2);border:1px solid var(--line2);border-radius:20px;padding:10px 12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;
  animation:rise .25s var(--ease)}
.rest.end{border-color:var(--ac);box-shadow:var(--shadow),0 0 0 3px var(--ac-soft)}
.rest-ring{flex:none;transform:rotate(-90deg)}
.rest-ring .bg{stroke:var(--s3)}
.rest-ring .fg{stroke:var(--ac);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.rest-lbl{font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest-time{font-size:34px;font-weight:700;line-height:1}
.rest.end .rest-time{font-size:22px;color:var(--ac-tx)}
.rest .tb{display:flex;gap:6px;flex:none}
.rest .tb .btn{min-width:48px;padding:0 8px;font-family:var(--f-num);font-size:17px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}

/* ---------- Hojas (diálogos) ---------- */
.modal{position:fixed;inset:0;z-index:40;background:rgba(5,6,10,.6);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s var(--ease)}
.sheet{background:var(--s1);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:var(--r-sheet) var(--r-sheet) 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line2);box-shadow:var(--shadow);animation:up .25s var(--ease)}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line2);margin:0 auto 14px}
.sheet h2{margin:0 0 10px;font:700 26px/1.1 var(--f-num)}
.sheet h3{font-size:12px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:var(--mu);margin:16px 0 8px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.field{margin:12px 0}
.field label{display:block;font-size:14px;color:var(--mu);margin-bottom:6px}
.inp{width:100%;min-height:48px;padding:10px 12px;border-radius:var(--r-ctl);border:1px solid var(--line2);background:var(--s2);color:var(--tx)}
.inp:focus{outline:2px solid var(--ac);outline-offset:1px}
textarea.inp{min-height:90px;resize:vertical}
select.inp{appearance:auto}
.seg{display:flex;background:var(--s2);border:1px solid var(--line2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:44px;border:0;border-radius:9px;background:none;color:var(--mu);font-weight:600;cursor:pointer;transition:background .2s var(--ease),color .2s var(--ease)}
.seg button.on{background:var(--ac);color:var(--ac-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chipx{display:inline-flex;align-items:center;gap:4px;background:var(--s2);border:1px solid var(--line2);border-radius:99px;padding:0 2px 0 14px;font:700 18px var(--f-num);min-height:44px}
.chipx button{border:0;background:none;color:var(--mu);font-size:20px;width:40px;height:40px;cursor:pointer}
.tog{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;width:100%;background:none;border:0;cursor:pointer;text-align:left;min-height:52px}
.sw{width:52px;height:32px;border-radius:99px;background:var(--s3);position:relative;flex:none;transition:background .2s var(--ease)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s var(--ease)}
.tog.on .sw{background:var(--ac)}.tog.on .sw::after{left:23px}
.lib-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px;cursor:pointer;min-height:56px;color:var(--tx)}
.lib-row{display:flex;gap:8px;align-items:stretch;margin:0 0 8px}
.lib-row .lib-item{margin:0}
.lib-row .q{min-width:56px;font:700 22px var(--f-num);color:var(--ac-tx)}
.guide{background:var(--s2);border-radius:12px;padding:4px 14px 12px;margin:6px 0 10px}
.sheet .guide{background:transparent;padding:0}
.guide h4{font-size:12px;letter-spacing:1.1px;text-transform:uppercase;margin:16px 0 8px;color:var(--ac-tx)}
ol.howto{margin:0;padding:0;list-style:none;counter-reset:st}
ol.howto li{counter-increment:st;position:relative;padding:0 0 12px 38px;font-size:15.5px;line-height:1.45}
ol.howto li::before{content:counter(st);position:absolute;left:0;top:-1px;width:26px;height:26px;border-radius:50%;background:var(--ac);color:var(--ac-ink);font:700 15px var(--f-num);display:flex;align-items:center;justify-content:center}
.btn.vid{background:var(--s3);border-color:var(--line2);color:var(--tx);margin-top:12px}
.list-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.list-row:first-of-type{border-top:0}

/* ---------- Gráficos ---------- */
.chartbox{position:relative;touch-action:pan-y}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--mu);font-size:11px;font-family:var(--f-txt)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .cross{stroke:var(--mu);stroke-width:1;stroke-dasharray:3 3}
.chart .last{stroke:var(--s1);stroke-width:3}
.readout{min-height:22px;font-size:13px;color:var(--mu);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 12px}
.readout b{color:var(--tx);font-family:var(--f-num);font-size:16px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mu);margin-top:6px}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:3px}
.legend i.dash{background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 7px)!important}

/* ---------- Historial ---------- */
.month{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1.2px;color:var(--mu);margin:20px 2px 8px}
.hs{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-card);margin:0 0 10px}
.hs-h{display:flex;gap:10px;align-items:center;width:100%;padding:14px;background:none;border:0;text-align:left;cursor:pointer;min-height:64px;color:var(--tx)}
.hs-b{padding:0 14px 14px;border-top:1px solid var(--line)}
.hs-b h3{font:700 19px var(--f-num);margin:16px 0 4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin:12px 0}
.kv dt{color:var(--mu)}.kv dd{margin:0}

/* ---------- Avisos, vacíos, reglas ---------- */
.toast{position:fixed;left:16px;right:16px;top:calc(10px + env(safe-area-inset-top));z-index:50;max-width:600px;margin:0 auto;background:var(--s2);border:1px solid var(--line2);
  color:var(--tx);border-radius:14px;padding:12px 14px;font-weight:600;box-shadow:var(--shadow);opacity:0;transform:translateY(-10px);transition:opacity .2s var(--ease),transform .2s var(--ease);pointer-events:none}
.toast.show{opacity:1;transform:none}
.toast.bad{border-color:var(--bad);border-left-width:4px}
.toast.ok{border-color:var(--ac-line);border-left:4px solid var(--ac)}
.empty{text-align:center;padding:36px 10px;color:var(--mu)}
.empty .e{font-size:44px}
.rules li{margin:8px 0}
.pill{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font:700 14px var(--f-num);color:var(--on-pain);flex:none}
.pill.na{background:var(--s3);color:var(--mu)}
.light{display:flex;gap:14px;align-items:center}
.light .lamp{width:46px;height:46px;border-radius:50%;flex:none;box-shadow:0 0 22px currentColor}
/* ---------- Personajes ---------- */
.pj-stage{margin:2px 0 12px}
.pj-fig{display:flex;justify-content:center;align-items:flex-end;gap:6px;background:linear-gradient(180deg,var(--s2),transparent);border-radius:12px;padding:6px 6px 0;min-height:126px}
.pj-fig svg{height:120px;width:auto;max-width:100%}
.pj-fig.rm svg{height:100px;max-width:45%}
.pj-fig .pj-side svg{height:76px}
.pj-arrow{color:var(--mu);align-self:center}
.bubble{position:relative;background:var(--s3);border-radius:14px;padding:10px 12px;margin-top:10px;font-size:15px;line-height:1.4}
.bubble::before{content:"";position:absolute;left:22px;top:-6px;width:12px;height:12px;background:var(--s3);transform:rotate(45deg);border-radius:2px}
.bubble small{display:block;font-size:12px;font-weight:600;margin-bottom:2px}
.pj-row{display:flex;gap:10px;align-items:center}
.pj-row > svg{height:86px;width:auto;flex:none}
.pj-row .bubble{flex:1;margin:0}
.pj-row .bubble::before{left:-5px;top:50%;margin-top:-6px}
.card .pj-row{margin-top:12px}

/* ---------- Movimiento ---------- */
/* ---------- Perfil y bienvenida ---------- */
.opts{display:grid;gap:8px}
.opts2{grid-template-columns:1fr 1fr}
.opt{min-height:52px;padding:10px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--s2);color:var(--tx);font-weight:600;text-align:left;cursor:pointer;transition:background .15s var(--ease),border-color .15s var(--ease)}
.opt.on{border-color:var(--ac);background:var(--ac-soft);box-shadow:inset 0 0 0 1px var(--ac)}
.opt.on::after{content:" ✓";color:var(--ac-tx)}
.chipx.tgl{padding:0 14px;font:600 15px var(--f-txt);cursor:pointer;color:var(--tx)}
.chipx.tgl.on{border-color:var(--ac);background:var(--ac-soft)}
.onb-top{margin:0 0 12px}
.onb-top .sesprog{margin-top:6px}
body.sin-tabs .tabs{display:none}
body.sin-tabs{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
/* ---------- Rutina desde foto o PDF ---------- */
.loading{display:flex;align-items:center;gap:12px;color:var(--mu);margin:14px 0}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--s3);border-top-color:var(--ac);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.rut-prev{display:block;max-width:100%;max-height:220px;margin:8px auto 4px;border-radius:12px;border:1px solid var(--line2);object-fit:contain;background:#fff}
.rut-file{display:flex;gap:10px;align-items:center;background:var(--s2);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;margin:8px 0;font-weight:600}
.ri{background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 10px}
.ri .field{margin:10px 0 0}
.ri-n{width:28px;height:28px;flex:none;border-radius:50%;background:var(--s3);display:flex;align-items:center;justify-content:center;font:700 16px var(--f-num)}
.ri-g2,.ri-g3{display:grid;gap:8px;margin-top:10px}
.ri-g2{grid-template-columns:1fr 1fr}
.ri-g3{grid-template-columns:1.2fr 1fr 1fr;align-items:end}
.ri .stp-c{width:100%}
.ri .stp-c .stp-b{width:40px}
.ri .inp{background:var(--s1)}
#view.enter > *{animation:enter .22s var(--ease) both}
#view.enter > *:nth-child(2){animation-delay:.03s}
#view.enter > *:nth-child(3){animation-delay:.06s}
#view.enter > *:nth-child(n+4){animation-delay:.09s}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall 1.5s cubic-bezier(.25,.6,.4,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--rot));opacity:.9}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .confetti{display:none}
}
@media (min-width:600px){.sheet{border-radius:var(--r-sheet);margin-bottom:20px}.modal{align-items:center}}
</style>
</head>
<body>
<header class="top"><h1 id="title">Inicio</h1><span id="top-extra"></span></header>
<main id="view" aria-live="polite"></main>

<div id="rest" class="rest" role="timer" hidden>
  <svg class="rest-ring" width="56" height="56" viewBox="0 0 56 56" aria-hidden="true">
    <circle class="bg" cx="28" cy="28" r="24" fill="none" stroke-width="5"/>
    <circle class="fg" id="rest-ring" cx="28" cy="28" r="24" fill="none" stroke-width="5" stroke-dasharray="150.8" stroke-dashoffset="0"/>
  </svg>
  <div class="grow">
    <div class="rest-lbl" id="rest-lbl">Descanso</div>
    <div class="rest-time" id="rest-time">0:00</div>
  </div>
  <div class="tb">
    <button class="btn sm" data-act="rest-add" data-d="-15" aria-label="Restar 15 segundos">−15</button>
    <button class="btn sm" data-act="rest-add" data-d="15" aria-label="Sumar 15 segundos">+15</button>
    <button class="btn sm" data-act="rest-skip" aria-label="Saltar descanso">Saltar</button>

</div>

  <button data-act="tab" data-tab="entreno"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6.5 6v12M17.5 6v12M3.5 9v6M20.5 9v6M6.5 12h11"/></svg><span data-t="tabs.entreno">Entreno</span><i class="live" id="live" hidden></i></button>
  <button data-act="tab" data-tab="historial"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg><span data-t="tabs.historial">Historial</span></button>
  <button data-act="tab" data-tab="progreso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-7"/></svg><span data-t="tabs.progreso">Progreso</span></button>
  <button data-act="tab" data-tab="mas"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg><span data-t="tabs.mas">Más</span></button>
</nav>
